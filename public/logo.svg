<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="dropGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8b5cf6" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <linearGradient id="facetGrad" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="rgba(255,255,255,0.85)" />
      <stop offset="40%" stopColor="rgba(255,255,255,0.2)" />
      <stop offset="100%" stopColor="rgba(0,0,0,0.3)" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Liquid Hexagon / Shard Shield -->
  <path d="M24 3L41 12.8V35.2L24 45L7 35.2V12.8L24 3Z" 
        stroke="url(#dropGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        fill="rgba(14, 18, 30, 0.6)"
        filter="url(#neonGlow)"/>

  <!-- Inner Liquid Drop / CS2 Blade Facets -->
  <path d="M24 9L36 17V31L24 39L12 31V17L24 9Z" 
        fill="url(#facetGrad)" 
        opacity="0.25"/>

  <!-- Stylized CS2 Angled Cross-Slashes -->
  <path d="M17 21L24 14L31 21L24 34L17 21Z" 
        fill="url(#dropGrad)" 
        opacity="0.9"/>

  <circle cx="24" cy="24" r="3" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)"/>
</svg>