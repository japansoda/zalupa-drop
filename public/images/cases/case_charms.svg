<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d24"/>
      <stop offset="50%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e303d"/>
      <stop offset="100%" stop-color="#14151b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="160" cy="240" rx="110" ry="14" fill="#000000" opacity="0.6" />

  <!-- Crate Body -->
  <polygon points="40,75 280,75 300,195 20,195" fill="url(#bodyGrad)" stroke="#2e303d" stroke-width="3" />

  <!-- Crate Lid -->
  <polygon points="25,75 295,75 275,35 45,35" fill="url(#metalGrad)" stroke="#3b3e4f" stroke-width="3" />

  <!-- Lid Reinforcement Bars -->
  <polygon points="55,35 75,35 60,75 40,75" fill="#FACC15" opacity="0.85" />
  <polygon points="245,35 265,35 280,75 260,75" fill="#FACC15" opacity="0.85" />
  <rect x="130" y="37" width="60" height="36" rx="4" fill="#1a1b22" stroke="#FACC15" stroke-width="2" />

  <!-- Handle / Locks -->
  <rect x="140" y="20" width="40" height="18" rx="4" fill="none" stroke="#94a3b8" stroke-width="4" />
  <rect x="80" y="70" width="16" height="20" rx="2" fill="#334155" stroke="#FACC15" stroke-width="1.5" />
  <rect x="224" y="70" width="16" height="20" rx="2" fill="#334155" stroke="#FACC15" stroke-width="1.5" />

  <!-- Side Grips / Bumpers -->
  <path d="M 20 195 L 30 110 L 42 110 L 32 195 Z" fill="#111217" stroke="#2e303d" stroke-width="2" />
  <path d="M 300 195 L 290 110 L 278 110 L 288 195 Z" fill="#111217" stroke="#2e303d" stroke-width="2" />

  <!-- Front Center Plate -->
  <rect x="70" y="95" width="180" height="85" rx="10" fill="#121319" stroke="#2a2c38" stroke-width="2" />

  <!-- Inner Graphic -->
  <g transform="translate(160, 137)">
    
  <circle cx="0" cy="-16" r="12" fill="none" stroke="#FACC15" stroke-width="4" />
  <circle cx="0" cy="-16" r="6" fill="none" stroke="#FFFFFF" stroke-width="2" />
  <path d="M 0 -2 L 18 10 L 0 26 L -18 10 Z" fill="#FACC15" />
  <path d="M 0 3 L 10 10 L 0 20 L -10 10 Z" fill="#FFFFFF" />
  <polygon points="-24,-4 -21,-1 -24,2 -27,-1" fill="#FACC15" />
  <polygon points="24,6 27,9 24,12 21,9" fill="#FACC15" />

  </g>

  <!-- Caution Hazard Stripes -->
  <g opacity="0.8">
    <line x1="55" y1="185" x2="265" y2="185" stroke="#FACC15" stroke-width="4" />
    <line x1="65" y1="189" x2="75" y2="181" stroke="#000000" stroke-width="3" />
    <line x1="95" y1="189" x2="105" y2="181" stroke="#000000" stroke-width="3" />
    <line x1="125" y1="189" x2="135" y2="181" stroke="#000000" stroke-width="3" />
    <line x1="155" y1="189" x2="165" y2="181" stroke="#000000" stroke-width="3" />
    <line x1="185" y1="189" x2="195" y2="181" stroke="#000000" stroke-width="3" />
    <line x1="215" y1="189" x2="225" y2="181" stroke="#000000" stroke-width="3" />
    <line x1="245" y1="189" x2="255" y2="181" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Badge Label -->
  <rect x="110" y="88" width="100" height="16" rx="8" fill="#000000" stroke="#FACC15" stroke-width="1.5" />
  <text x="160" y="100" text-anchor="middle" fill="#FACC15" font-size="9" font-family="Arial, sans-serif" font-weight="900" letter-spacing="1.5">CHARMS</text>
</svg>